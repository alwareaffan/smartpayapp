<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 260" role="img" aria-labelledby="title desc">
  <title id="title">SmartPay recharge advert</title>
  <desc id="desc">A complete SmartPay banner for mobile recharge with phone illustration, coins, and offer text.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7a2d10"/>
      <stop offset="0.48" stop-color="#f26522"/>
      <stop offset="1" stop-color="#ffca1b"/>
    </linearGradient>
    <linearGradient id="phone" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ffe9d8"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#4a1b08" flood-opacity="0.26"/>
    </filter>
  </defs>

  <rect width="680" height="260" rx="38" fill="url(#bg)"/>
  <circle cx="595" cy="42" r="86" fill="#ffca1b" opacity="0.34"/>
  <circle cx="88" cy="228" r="118" fill="#ffffff" opacity="0.10"/>
  <path d="M0 206c94-38 190-46 306-21 114 24 225 12 374-66v141H0z" fill="#ffffff" opacity="0.13"/>

  <g transform="translate(48 44)" filter="url(#softShadow)">
    <rect x="0" y="0" width="190" height="172" rx="34" fill="url(#phone)"/>
    <rect x="68" y="14" width="54" height="7" rx="4" fill="#f26522" opacity="0.35"/>
    <rect x="52" y="34" width="86" height="106" rx="20" fill="#3f2418"/>
    <rect x="63" y="47" width="64" height="78" rx="14" fill="#ffca1b"/>
    <path d="M99 58 77 94h23l-8 34 36-48h-24l12-22z" fill="#f26522"/>
    <circle cx="95" cy="153" r="7" fill="#f26522" opacity="0.5"/>
  </g>

  <g transform="translate(206 54)">
    <circle cx="8" cy="20" r="18" fill="#ffca1b"/>
    <text x="8" y="27" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="900" fill="#7a2d10">%</text>
    <circle cx="28" cy="126" r="14" fill="#ffffff" opacity="0.32"/>
    <circle cx="380" cy="112" r="18" fill="#ffffff" opacity="0.24"/>
  </g>

  <g transform="translate(292 50)" fill="#ffffff">
    <text font-family="Arial, sans-serif" font-size="25" font-weight="800" opacity="0.92">SmartPay</text>
    <text y="55" font-family="Arial, sans-serif" font-size="41" font-weight="900">Recharge &amp; Save</text>
    <text y="91" font-family="Arial, sans-serif" font-size="21" font-weight="700" opacity="0.84">Instant top-ups with cashback</text>
    <g transform="translate(0 118)">
      <rect width="178" height="42" rx="21" fill="#ffffff" opacity="0.18"/>
      <text x="24" y="27" font-family="Arial, sans-serif" font-size="17" font-weight="800">Pay in seconds</text>
    </g>
  </g>
</svg>
