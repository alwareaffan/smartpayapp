<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 260" role="img" aria-labelledby="title desc">
  <title id="title">SmartPay QR advert</title>
  <desc id="desc">A complete SmartPay QR payment banner with scanner illustration and clear campaign text.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2c160d"/>
      <stop offset="0.58" stop-color="#f26522"/>
      <stop offset="1" stop-color="#ffca1b"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="15" flood-color="#2c160d" flood-opacity="0.32"/>
    </filter>
  </defs>

  <rect width="680" height="260" rx="38" fill="url(#bg)"/>
  <circle cx="610" cy="54" r="90" fill="#ffca1b" opacity="0.34"/>
  <circle cx="116" cy="230" r="132" fill="#ffffff" opacity="0.09"/>
  <path d="M0 204c88-28 172-28 252 0 104 36 222 22 428-74v130H0z" fill="#ffffff" opacity="0.12"/>

  <g transform="translate(56 42)" filter="url(#softShadow)">
    <rect width="178" height="178" rx="36" fill="#ffffff"/>
    <g fill="#3f2418">
      <rect x="30" y="30" width="38" height="38" rx="8"/>
      <rect x="110" y="30" width="38" height="38" rx="8"/>
      <rect x="30" y="110" width="38" height="38" rx="8"/>
      <rect x="84" y="82" width="20" height="20" rx="5"/>
      <rect x="112" y="84" width="36" height="18" rx="5"/>
      <rect x="84" y="114" width="20" height="34" rx="5"/>
      <rect x="114" y="120" width="34" height="28" rx="5"/>
    </g>
    <path d="M20 89h138" stroke="#f26522" stroke-width="5" stroke-linecap="round" opacity="0.74"/>
    <rect x="16" y="16" width="146" height="146" rx="28" fill="none" stroke="#f26522" stroke-width="4" opacity="0.2"/>
  </g>

  <g transform="translate(218 66)">
    <path d="M0 0h34v10H10v24H0z" fill="#ffffff" opacity="0.52"/>
    <path d="M360 0h-34v10h24v24h10z" fill="#ffffff" opacity="0.52"/>
    <path d="M0 116h34v-10H10V82H0z" fill="#ffffff" opacity="0.52"/>
    <path d="M360 116h-34v-10h24V82h10z" fill="#ffffff" opacity="0.52"/>
  </g>

  <g transform="translate(302 54)" fill="#ffffff">
    <text font-family="Arial, sans-serif" font-size="26" font-weight="800" opacity="0.9">SmartPay QR</text>
    <text y="56" font-family="Arial, sans-serif" font-size="42" font-weight="900">Scan. Pay. Done.</text>
    <text y="92" font-family="Arial, sans-serif" font-size="20" font-weight="700" opacity="0.84">Fast checkout at nearby merchants</text>
    <g transform="translate(0 120)">
      <rect width="150" height="42" rx="21" fill="#ffffff" opacity="0.18"/>
      <text x="24" y="27" font-family="Arial, sans-serif" font-size="17" font-weight="800">Secure mode</text>
    </g>
  </g>
</svg>
