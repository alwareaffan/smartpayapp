<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 260" role="img" aria-labelledby="title desc">
  <title id="title">SmartPay bills advert</title>
  <desc id="desc">A complete SmartPay banner for bill payments with utility icons and readable text.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3f2418"/>
      <stop offset="0.58" stop-color="#d94f12"/>
      <stop offset="1" stop-color="#ffca1b"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff8f3"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#3f2418" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="680" height="260" rx="38" fill="url(#bg)"/>
  <path d="M474-28c70 28 120 78 151 148 24 54 27 104 8 140h47V0z" fill="#ffca1b" opacity="0.34"/>
  <path d="M0 42c116 42 226 38 344-12 112-47 214-43 336 13V0H0z" fill="#ffffff" opacity="0.11"/>
  <circle cx="84" cy="220" r="110" fill="#ffffff" opacity="0.08"/>

  <g transform="translate(50 56)" filter="url(#softShadow)">
    <rect x="0" y="0" width="138" height="138" rx="30" fill="url(#card)"/>
    <path d="M78 24 42 82h26l-7 34 45-62H78l13-30z" fill="#f26522"/>
    <text x="69" y="164" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="800" fill="#ffffff">Electricity</text>
  </g>

  <g transform="translate(186 82)" filter="url(#softShadow)">
    <rect x="0" y="0" width="118" height="118" rx="28" fill="url(#card)"/>
    <path d="M59 22s32 38 32 65a32 32 0 0 1-64 0c0-27 32-65 32-65z" fill="#1aa6a6"/>
    <path d="M45 90c8 7 20 7 28 0" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" opacity="0.76"/>
    <text x="59" y="144" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="800" fill="#ffffff">Water</text>
  </g>

  <g transform="translate(344 50)" fill="#ffffff">
    <text font-family="Arial, sans-serif" font-size="23" font-weight="800" opacity="0.9">Powering Everyday Payments</text>
    <text y="54" font-family="Arial, sans-serif" font-size="39" font-weight="900">Bills made simple</text>
    <text y="90" font-family="Arial, sans-serif" font-size="20" font-weight="700" opacity="0.84">Electricity, water, DTH and more</text>
    <g transform="translate(0 118)">
      <rect width="56" height="42" rx="16" fill="#ffffff" opacity="0.18"/>
      <path d="M30 9 19 25h8l-3 12 14-19h-8l5-9z" fill="#ffffff"/>
      <rect x="70" width="56" height="42" rx="16" fill="#ffffff" opacity="0.18"/>
      <path d="M98 8s14 16 14 28a14 14 0 0 1-28 0c0-12 14-28 14-28z" fill="#ffffff"/>
      <rect x="140" width="56" height="42" rx="16" fill="#ffffff" opacity="0.18"/>
      <text x="168" y="28" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="900">TV</text>
    </g>
  </g>
</svg>
